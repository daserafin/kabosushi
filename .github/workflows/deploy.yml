# Builds web/ and publishes it to GitHub Pages at https://kabosushi.daserafin.com.
# Runs on every push to main, or by hand from the Actions tab.
#
# The custom domain is set in the repo's Settings → Pages, not here: with an Actions
# deploy, GitHub ignores a CNAME file in the build output.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job gets a short-lived token that may publish Pages, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push doesn't cancel a deploy that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Vite bakes VITE_* values into the JavaScript at build time. They come from the
      # repo's Settings → Secrets and variables → Actions → Variables: not secrets, since
      # every visitor downloads them anyway. Grants + RLS protect the data.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
